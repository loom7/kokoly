name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  jvm-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: JVM-Tests und Lint
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug
